<!doctype html>
<!--
  Type Library (dial fork): a type tester for your installed fonts and Google Fonts.
  Fonts on a disc that rises from the left edge, weights on a card at the right edge.

  Credits
  - Layout and interaction inspired by Kostić Type Foundry's homepage type tester: https://kostictype.com/
  - The font wheel is modelled on Framer's "Circle Wrap" component: https://framer.com/m/Circle-Wrap-OvEV.js
  - Visual style after Drams (Dieter Rams / Teenage Engineering inspired components): https://drams.framer.website/
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="">

<main class="stage empty" id="stage">
  <div class="pill" id="headPill">
    <button class="chip icon" id="export" title="Download this font file"><svg viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 19h14"/></svg></button>
    <button class="chip" id="headName" title="Change headline font">Headline</button>
    <button class="chip icon" id="liga" aria-pressed="false" title="Ligatures">fi</button>
    <button class="chip icon" id="pen" title="Edit outlines (Google fonts only)" hidden><svg viewBox="0 0 24 24"><path d="M12 3l6 8-6 10-6-10zM12 14v-3M9 21h6"/></svg></button>
  </div>
  <div class="line" id="line">
    <h1 class="headline" id="headline" contenteditable="plaintext-only" spellcheck="false" aria-label="Type a word"></h1>
    <span class="ibeam" id="ibeam" aria-hidden="true"></span>
  </div>
  <div class="pill" id="paraPill" hidden>
    <button class="chip" id="paraName" title="Change paragraph font">Paragraph</button>
    <button class="chip icon" id="closeArticle" title="Hide article">×</button>
  </div>
  <p class="hint" id="hint">Type + ↵</p>
</main>

<article class="result" id="result" hidden></article>
<button class="corner" id="openArticle" title="Show article" hidden><svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h8"/></svg></button>
<button class="corner" id="light" aria-pressed="false" title="Dark mode">
  <svg class="moon" viewBox="0 0 20 20"><path d="M16 12.5A6.5 6.5 0 1 1 7.5 4a5.2 5.2 0 0 0 8.5 8.5z"/></svg>
  <svg class="sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.4"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg>
</button>

<!-- Font disc and its controls -->
<div class="disc dial-ui" id="disc"></div>
<div id="wheel" class="dial-ui" tabindex="0" aria-label="Font dial: scroll, drag or use the arrow keys"><span class="sel-bar" id="selBar"></span><svg class="ticks"><path id="ticks"/></svg><span class="pointer" id="pointer"></span></div>
<div class="controls dial-ui">
  <div class="tabs"><button data-src="google">Google</button><button data-src="mine">My fonts</button></div>
  <label class="search"><input type="search" id="dq" placeholder="Search my fonts" aria-label="Search fonts"></label>
  <button class="fbtn" id="fBtn" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/><circle cx="7" cy="5" r="1.8"/><circle cx="13" cy="10" r="1.8"/><circle cx="6" cy="15" r="1.8"/></svg><span id="fLabel">Filters</span></button>
  <div class="fpanel" id="fPanel" hidden></div>
  <p id="dMsg" hidden></p>
</div>
<div class="count" id="dCount"></div>

<!-- Weights: shown only when the family has more than one style -->
<aside class="wcard dial-ui" id="wcard" aria-label="Weights"><h6 id="wCount"></h6><div class="wwin" id="wwin"><div class="wlist" id="wlist"></div></div></aside>

<script src="app.js"></script>
</body>
</html>
